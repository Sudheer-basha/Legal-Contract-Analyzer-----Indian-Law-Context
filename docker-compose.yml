version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: contract_analyzer_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contract_analyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: contract_analyzer_redis
    ports:
      - "6380:6379"
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: contract_analyzer_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contract_analyzer_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - USE_SQLITE=false
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=contract_analyzer
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SIMULATE_BACKGROUND_SERVICES=false
    ports:
      - "8080:8000"
    volumes:
      - ./backend:/workspace
      - ./frontend:/frontend
      - encrypted_docs:/workspace/uploads
    depends_on:
      - db
      - redis
      - qdrant
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contract_analyzer_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - USE_SQLITE=false
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=contract_analyzer
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SIMULATE_BACKGROUND_SERVICES=false
    volumes:
      - ./backend:/workspace
      - encrypted_docs:/workspace/uploads
    depends_on:
      - redis
      - db
      - qdrant
    restart: always

  grafana:
    image: grafana/grafana-oss:latest
    container_name: contract_analyzer_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: always

volumes:
  pgdata:
  qdrant_data:
  encrypted_docs:
  grafana_data:
